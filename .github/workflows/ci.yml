name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_PYTHON: "3.12"

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: imo_lms_test
          POSTGRES_USER: imo
          POSTGRES_PASSWORD: imo
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U imo -d imo_lms_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgres://imo:imo@localhost:5432/imo_lms_test
      REDIS_URL: redis://localhost:6379/0
      SECRET_KEY: ci-not-secret
      DJANGO_SETTINGS_MODULE: config.settings.test
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Sync dependencies
        run: uv sync --all-extras --dev

      - name: Ruff
        run: uv run ruff check . && uv run ruff format --check .

      - name: Mypy (soft)
        continue-on-error: true
        run: uv run mypy .

      - name: Pytest
        run: uv run pytest -q --tb=short

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Vitest
        run: pnpm test -- --run

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    continue-on-error: true
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: imo_lms_e2e
          POSTGRES_USER: imo
          POSTGRES_PASSWORD: imo
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U imo -d imo_lms_e2e"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgres://imo:imo@localhost:5432/imo_lms_e2e
      REDIS_URL: redis://localhost:6379/0
      SECRET_KEY: e2e-not-secret
      DJANGO_SETTINGS_MODULE: config.settings.test
      NEXT_PUBLIC_API_URL: http://127.0.0.1:8000
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Backend deps
        working-directory: backend
        run: uv sync --all-extras --dev

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Frontend deps
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        working-directory: frontend
        run: pnpm exec playwright install --with-deps chromium

      - name: Migrate & seed
        working-directory: backend
        run: |
          uv run python manage.py migrate --noinput
          uv run python manage.py seed_demo || true

      - name: Smoke E2E
        working-directory: frontend
        run: pnpm exec playwright test --grep @smoke || pnpm exec playwright test --list
